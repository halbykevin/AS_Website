<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="fw5Sai7ohTaQHYwYwqVeKtxtdyc5lmYDLhpi2EpnfUg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#A41E22" />

    <!-- Per-route head: title, description, canonical, OpenGraph/Twitter,
         favicon and JSON-LD. scripts/prerender.mjs replaces everything between
         these markers with the route's own tags (src/lib/seo.js), and
         <RouteHead> keeps them in step as a visitor navigates. What is here is
         only the fallback for pages that are not pre-rendered (dev, admin). -->
    <!--seo:start-->
    <title>AS Company — Telecommunication &amp; Electronics in Lebanon</title>
    <meta
      name="description"
      content="AS Company (Absolute Solutions SAL) — market leader in telecommunication and electronics in Lebanon since 2008."
    />
    <link rel="icon" href="/ASCompanyLogo.jpg" />
    <link rel="apple-touch-icon" href="/ASCompanyLogo.jpg" />
    <!--seo:end-->

    <!-- Warm up the origins the first paint needs: the API (content refresh +
         logo) and the store's image host, which serves the homepage slideshow's
         product photos — the largest thing above the fold. The event-image
         CDNs that used to be here served a banner the homepage no longer has. -->
    <link rel="preconnect" href="https://asapi.as.com.lb" crossorigin />
    <link rel="preconnect" href="https://store-api.as.com.lb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: fetch as "print", then swap to "all" on load -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EX7D8HZPKY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-EX7D8HZPKY');
</script>
  </body>
</html>
