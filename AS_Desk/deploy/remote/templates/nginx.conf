# Managed by ASDesk (deploy/remote/provision.sh) — rewritten on every provision; edit the template instead.
upstream asdesk_api {
    server 127.0.0.1:@APP_PORT@;
    keepalive 16;
}

server {
    listen 80;
    server_name @DOMAIN@;
    server_tokens off;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name @DOMAIN@;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API accepts at most 8 KiB bodies; reject anything larger at the edge.
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # X-Forwarded-For is set, never appended, so a client cannot forge its address; the API
    # trusts it only from 127.0.0.1 (TRUST_PROXY). proxy_set_header is not inherited by a
    # location that sets its own, so each location lists the full set.
    location = /ws {
        proxy_pass http://asdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # The server pings every 15 s; a silent minute means the peer is gone.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /downloads/ {
        alias @BASE@/downloads/;
        autoindex off;
        expires -1;
        location ~ /\. { deny all; }
    }

    location / {
        proxy_pass http://asdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
